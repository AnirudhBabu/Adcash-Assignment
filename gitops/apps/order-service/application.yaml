apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service
  namespace: argocd
  labels:
    platform.idp/tenant: staging
spec:
  project: default
  source:
    repoURL: https://github.com/AnirudhBabu/Adcash-Assignment.git
    targetRevision: main
    path: apps/order-service/helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
