image:
  repository: ghcr.io/anirudhbabu/order-service
  tag: v2.0.0

replicas: 5
port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

canary:
  steps:
    - setWeight: 10
    - pause: 2m
    - setWeight: 50
    - pause: 5m
    - setWeight: 100
  successRateThreshold: 0.995
  p99LatencyThresholdSeconds: 0.3
